name: ipd

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipdetection
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ipdetection"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ipdetection
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["bun", "run", "scripts/migrate.ts", "up"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ipdetection
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniominio
      S3_BUCKET: ip-detection
      API_PORT: 8080
      EMBEDDING_DIM: 768
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/contracts/src:/app/packages/contracts/src

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL_SECONDS: 2
      WORKER_LEASE_SECONDS: 120
      EMBEDDING_MODEL: fake-deterministic
      EMBEDDING_DIM: 768
    depends_on:
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../apps/worker:/app

volumes:
  pg_data:
  minio_data:
